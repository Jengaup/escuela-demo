name = "escuela-demo"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Archivos de la app (HTML, CSS, JS). El Worker corre primero para proteger las páginas.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "escuela-demo"
# ID de la base D1 "escuela-demo" en Cloudflare
database_id = "6d4c54d9-95c3-4fb8-bafc-c96020287eee"
migrations_dir = "migrations"

[vars]
# "true" muestra el botón "Resetear datos demo" (solo admin). Ponlo en "false" en producción real.
DEMO_MODE = "true"
