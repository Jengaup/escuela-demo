<!doctype html>
<html lang="es-PR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asistencia · Escuela de Artes</title>
<link rel="icon" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18/dist/index.global.js"></script>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js"></script>
<script src="/assets/nfc.js"></script>
</head>
<body data-page="checkin" x-data="checkin()">
<div id="shell"></div>

<main class="max-w-6xl mx-auto p-4 space-y-4">
  <div class="flex flex-wrap items-center gap-3">
    <div>
      <h1 class="text-2xl font-semibold text-stone-900">Asistencia del día</h1>
      <p class="text-stone-500" x-text="App.fmtDate(day.date, { weekday: 'long', day: 'numeric', month: 'long' })"></p>
    </div>
    <div class="ml-auto flex items-center gap-2 card px-3 py-2" x-show="day.band" x-cloak>
      <span class="w-5 h-5 rounded-full border border-stone-300" :style="`background:${bandHex(day.band)}`"></span>
      <span class="text-sm text-stone-600">Banda de hoy: <strong class="text-stone-900" x-text="day.band"></strong></span>
    </div>
  </div>

  <!-- Lector de chapitas -->
  <section class="card px-4 py-3 flex flex-wrap items-center gap-3" aria-live="polite">
    <span class="relative flex w-3 h-3">
      <span class="absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75 animate-ping" x-show="readerReady"></span>
      <span class="relative inline-flex rounded-full w-3 h-3" :class="readerReady ? 'bg-emerald-500' : 'bg-stone-300'"></span>
    </span>
    <div class="flex-1 min-w-[12rem]">
      <div class="font-medium text-stone-900" x-text="readerReady ? 'Listo: pasa la chapita' : 'Lector NFC apagado'"></div>
      <div class="text-sm text-stone-500" x-text="readerHint"></div>
    </div>
    <button type="button" class="btn btn-primary" x-show="nfcSupported && !nfcOn" @click="startNfc()">Activar lector NFC</button>
    <button type="button" class="btn btn-secondary text-sm" x-show="demo" x-cloak @click="simulate()">Simular chapita</button>
  </section>

  <!-- Clases de hoy -->
  <section aria-label="Clases de hoy">
    <div class="flex gap-3 overflow-x-auto pb-1 scrollbar-none">
      <template x-for="s in day.sessions" :key="s.id">
        <button type="button" @click="openSession(s.id)"
          class="card text-left p-4 min-w-[15rem] shrink-0 transition border-2"
          :class="current?.id === s.id ? 'border-accent bg-accent-soft' : 'border-transparent hover:border-stone-300'">
          <div class="text-sm text-stone-500" x-text="`${App.fmtTime(s.start_time)} – ${App.fmtTime(s.end_time)}`"></div>
          <div class="font-semibold text-stone-900 text-lg" x-text="s.course_name"></div>
          <div class="text-sm text-stone-500" x-text="s.instructor"></div>
          <div class="mt-3 h-2 bg-stone-200 rounded-full overflow-hidden">
            <div class="h-full bg-emerald-500" :style="`width:${s.enrolled ? Math.min(100, s.banded / s.enrolled * 100) : 0}%`"></div>
          </div>
          <div class="text-xs text-stone-500 mt-1" x-text="`${s.present} llegaron · ${s.banded} de ${s.enrolled} completos`"></div>
        </button>
      </template>
      <div class="card p-6 text-stone-500 w-full text-center" x-show="loaded && !day.sessions.length" x-cloak>
        No hay clases programadas para hoy.
      </div>
    </div>
  </section>

  <!-- Lista de estudiantes -->
  <section x-show="current" x-cloak class="space-y-3">
    <div class="flex flex-wrap gap-2 items-center">
      <input type="search" class="input sm:max-w-xs" placeholder="Buscar estudiante…" x-model="q" aria-label="Buscar estudiante">
      <div class="flex gap-1 bg-white border border-stone-200 rounded-xl p-1" role="tablist">
        <template x-for="f in filters" :key="f.key">
          <button type="button" class="px-3 py-2 rounded-lg text-sm font-medium min-h-[40px]"
            :class="filter === f.key ? 'bg-stone-900 text-white' : 'text-stone-600'" @click="filter = f.key"
            x-text="`${f.label} (${count(f.key)})`"></button>
        </template>
      </div>
      <a class="btn btn-secondary ml-auto" :href="`/lista?s=${current?.id}`" target="_blank" rel="noopener">Imprimir lista</a>
    </div>

    <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
      <template x-for="st in visible" :key="st.id">
        <button type="button" @click="openStudent(st)"
          class="card p-4 text-left border-2 transition active:scale-[.99]"
          :class="complete(st) ? 'border-emerald-400 bg-emerald-50' : st.attendance_id ? 'border-amber-300' : 'border-transparent hover:border-stone-300'">
          <div class="flex items-start gap-3">
            <div class="w-11 h-11 shrink-0 rounded-full grid place-items-center font-semibold"
              :class="complete(st) ? 'bg-emerald-500 text-white' : 'bg-stone-100 text-stone-600'">
              <span x-show="!complete(st)" x-text="st.first_name[0] + st.last_name[0]"></span>
              <svg x-show="complete(st)" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <div class="min-w-0">
              <div class="font-semibold text-stone-900 text-lg leading-tight truncate" x-text="`${st.first_name} ${st.last_name}`"></div>
              <div class="text-sm text-stone-500 truncate" x-text="subtitle(st)"></div>
            </div>
          </div>
          <div class="flex flex-wrap gap-2 mt-3">
            <span class="pill" :class="st.attendance_id ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-100 text-stone-500'"
              x-text="st.attendance_id ? (st.check_in_method === 'nfc' ? 'Llegó · chapita' : 'Llegó · manual') : 'No ha llegado'"></span>
            <span class="pill" :class="paid(st) ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-100 text-stone-500'"
              x-text="paid(st) ? 'Pagó' : 'Pago'"></span>
            <span class="pill" :class="st.band_delivered ? 'bg-emerald-100 text-emerald-800' : 'bg-stone-100 text-stone-500'">Banda</span>
            <span class="pill bg-red-100 text-red-800" x-show="owes(st)" x-text="`Debe ${App.money(owes(st))}`"></span>
            <span class="pill bg-amber-100 text-amber-800" x-show="!st.has_nfc">Sin chapita</span>
          </div>
        </button>
      </template>
    </div>
    <p class="text-center text-stone-500 py-6" x-show="!visible.length">No hay estudiantes en esta vista.</p>
  </section>
</main>

<!-- Ficha del estudiante + cobro -->
<div class="modal-backdrop" x-show="sel" x-cloak @keydown.escape.window="close()" @click.self="close()">
  <div class="modal p-5 sm:p-6 space-y-5" role="dialog" aria-modal="true" aria-labelledby="mTitle" x-show="sel" x-transition.opacity>
    <template x-if="sel">
      <div class="space-y-5">
        <div class="flex items-start gap-4">
          <div class="w-24 h-24 sm:w-28 sm:h-28 shrink-0 rounded-2xl overflow-hidden bg-stone-100 grid place-items-center text-3xl font-semibold text-stone-500">
            <img x-show="photo" :src="photo" alt="" class="w-full h-full object-cover">
            <span x-show="!photo" x-text="sel.first_name[0] + sel.last_name[0]"></span>
          </div>
          <div class="min-w-0 flex-1">
            <h2 id="mTitle" class="text-2xl font-semibold text-stone-900 leading-tight" x-text="`${sel.first_name} ${sel.last_name}`"></h2>
            <p class="text-stone-500" x-text="current.course_name"></p>
            <p class="text-sm text-stone-500" x-text="subtitle(sel)"></p>
            <p class="text-sm text-stone-500" x-show="sel.phone" x-text="sel.phone"></p>
          </div>
          <button type="button" class="btn-ghost text-2xl leading-none" @click="close()" aria-label="Cerrar">&times;</button>
        </div>

        <p class="text-sm text-amber-900 bg-amber-50 rounded-lg px-3 py-2" x-show="sel.notes" x-text="'Nota: ' + sel.notes"></p>
        <p class="text-sm text-red-800 bg-red-50 rounded-lg px-3 py-2" x-show="sel.other_due_cents"
          x-text="`Debe ${App.money(sel.other_due_cents)} de antes.`"></p>
        <p class="text-sm text-emerald-800 bg-emerald-50 rounded-lg px-3 py-2" x-show="sel.credit_cents"
          x-text="`Tiene ${App.money(sel.credit_cents)} a favor.`"></p>

        <!-- 1. Asistencia -->
        <section class="flex items-center gap-2">
          <span class="w-7 h-7 rounded-full grid place-items-center text-sm font-bold bg-emerald-500 text-white" x-show="sel.attendance_id">✓</span>
          <span class="w-7 h-7 rounded-full grid place-items-center text-sm font-bold bg-stone-900 text-white" x-show="!sel.attendance_id">1</span>
          <h3 class="font-semibold">Asistencia</h3>
          <span class="ml-auto text-sm" :class="sel.attendance_id ? 'text-emerald-700' : 'text-stone-500'"
            x-text="sel.attendance_id ? `Llegó ${timeOf(sel.checked_in_at)} · ${sel.check_in_method === 'nfc' ? 'con chapita' : 'marcado a mano'}` : 'Se marcará al confirmar'"></span>
        </section>

        <!-- 2. Pago -->
        <section class="space-y-2">
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-full grid place-items-center text-sm font-bold"
              :class="!needPay || method ? 'bg-emerald-500 text-white' : 'bg-stone-900 text-white'" x-text="!needPay ? '✓' : '2'"></span>
            <h3 class="font-semibold">Pago</h3>
            <span class="ml-auto text-sm text-emerald-700" x-show="!needPay" x-text="`Clase pagada (${App.money(sel.class_cents)})`"></span>
          </div>
          <template x-if="needPay">
            <div class="space-y-2">
              <div class="grid grid-cols-3 gap-2">
                <template x-for="m in methods" :key="m">
                  <button type="button" class="btn btn-lg px-2" :class="method === m ? 'btn-primary' : 'btn-secondary'"
                    @click="method = method === m ? null : m" x-text="App.METHOD_LABEL[m]"></button>
                </template>
              </div>
              <div class="flex items-center gap-2">
                <label class="text-sm text-stone-600 whitespace-nowrap" for="amt">Monto $</label>
                <input id="amt" class="input max-w-[8rem]" inputmode="decimal" x-model="amount">
                <span class="text-xs text-stone-500">Precargado según el curso.</span>
              </div>
            </div>
          </template>
        </section>

        <!-- 3. Banda -->
        <section class="space-y-2">
          <label class="flex items-center gap-3 card px-4 py-3 cursor-pointer" x-show="needBand">
            <input type="checkbox" class="w-6 h-6 accent-indigo-700" x-model="band">
            <span class="w-5 h-5 rounded-full border" :style="`background:${bandHex(current.band)}`"></span>
            <span>Entregué la banda <strong x-text="current.band"></strong></span>
          </label>
          <p class="text-sm text-emerald-700" x-show="!needBand" x-text="`✓ Banda ${sel.band_code} entregada`"></p>
        </section>

        <p class="text-sm text-red-700 bg-red-50 rounded-lg px-3 py-2" x-show="error" x-text="error" role="alert"></p>

        <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-sm">
          <a class="text-accent underline" :href="`/estudiantes?id=${sel.id}`">Ver ficha completa</a>
          <template x-if="isAdmin && sel.attendance_id">
            <div class="flex gap-4 ml-auto">
              <button type="button" class="text-red-700 underline" @click="undo()">Anular asistencia</button>
            </div>
          </template>
        </div>

        <div class="flex flex-col-reverse sm:flex-row gap-2 sticky -bottom-5 sm:-bottom-6 -mx-5 sm:-mx-6 px-5 sm:px-6 py-3 bg-white border-t border-stone-100">
          <button type="button" class="btn btn-secondary btn-lg sm:mr-auto" x-show="sel.attendance_id && needPay && !complete(sel)" @click="close()">Cobrar después</button>
          <button type="button" class="btn btn-primary btn-lg sm:ml-auto sm:min-w-[16rem]" x-show="!complete(sel)"
            :disabled="!canConfirm || busy" @click="confirm()" x-text="busy ? 'Guardando…' : confirmLabel"></button>
          <button type="button" class="btn btn-secondary btn-lg sm:ml-auto" x-show="complete(sel)" @click="close()">Cerrar</button>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
const BAND_HEX = { Azul: '#2563eb', Verde: '#16a34a', Amarillo: '#facc15', Rojo: '#dc2626', Morado: '#7c3aed', Anaranjado: '#f97316', Rosa: '#ec4899' };

function checkin() {
  return {
    day: { date: '', band: '', sessions: [] },
    loaded: false,
    current: null,
    students: [],
    q: '',
    filter: 'pendientes',
    filters: [{ key: 'pendientes', label: 'Pendientes' }, { key: 'completos', label: 'Completos' }, { key: 'todos', label: 'Todos' }],
    methods: ['efectivo', 'ath_movil', 'tarjeta'],
    sel: null, method: null, amount: '', band: true, photo: '', ref: '',
    busy: false, error: '', isAdmin: false, demo: false,
    nfcSupported: NfcInput.webNfcSupported, nfcOn: false,

    get readerReady() { return this.nfcOn || !this.nfcSupported; },
    get readerHint() {
      if (this.nfcOn) return 'NFC de la tablet activo. Acerca la chapita a la parte de atrás.';
      if (this.nfcSupported) return 'Toca "Activar lector NFC" una vez para empezar.';
      return 'Usa el lector USB de chapitas. Si alguien no la trae, tócalo en la lista.';
    },

    async init() {
      App.me().then((r) => { this.isAdmin = r.user.role === 'admin'; this.demo = r.demo; });
      NfcInput.on((uid) => this.tap(uid));
      await this.loadDay();
      const fromUrl = Number(new URLSearchParams(location.search).get('s'));
      const pick = this.day.sessions.find((s) => s.id === fromUrl) || this.day.sessions[0];
      if (pick) await this.openSession(pick.id);
    },
    bandHex(code) { return BAND_HEX[(code || '').split('-')[0]] || '#a8a29e'; },
    timeOf(iso) { return iso ? new Date(iso).toLocaleTimeString('es-PR', { timeZone: 'America/Puerto_Rico', hour: 'numeric', minute: '2-digit' }) : ''; },
    async loadDay() {
      try { this.day = await App.api('GET', '/api/checkin/day'); }
      catch (e) { App.toast(e.message, 'error'); }
      this.loaded = true;
    },
    async openSession(id) {
      try {
        const r = await App.api('GET', `/api/checkin/session/${id}`);
        this.current = r.session;
        this.students = r.students.sort((a, b) => `${a.first_name} ${a.last_name}`.localeCompare(`${b.first_name} ${b.last_name}`, 'es'));
        history.replaceState(null, '', `?s=${id}`);
      } catch (e) { App.toast(e.message, 'error'); }
    },
    async startNfc() {
      try { await NfcInput.startWebNfc(); this.nfcOn = true; App.toast('Lector NFC activo'); }
      catch (e) { App.toast(e.message || 'No se pudo activar el NFC', 'error'); }
    },

    // Llega una chapita: marca asistencia y abre la ficha para cobrar.
    async tap(uid) {
      try {
        const r = await App.api('POST', '/api/checkin/tap', { uid });
        this.close();
        await Promise.all([this.openSession(r.session_id), this.loadDay()]);
        const st = this.students.find((s) => s.id === r.student_id);
        if (st) {
          this.filter = 'todos';
          this.openStudent(st);
          if (r.already) App.toast(`${st.first_name} ya había pasado la chapita`);
        }
      } catch (e) {
        App.toast(e.message, 'error');
      }
    },
    async simulate() {
      const pending = this.students.filter((s) => s.has_nfc && !s.attendance_id);
      if (!pending.length) return App.toast('No quedan estudiantes con chapita pendientes en esta clase', 'error');
      const st = pending[Math.floor(Math.random() * pending.length)];
      const d = await App.api('GET', `/api/students/${st.id}`);
      NfcInput.simulate(d.student.nfc_uid);
    },

    paid(st) { return !!(st.charge_id && st.class_due_cents === 0); },
    owes(st) { return (st.class_due_cents || 0) + (st.other_due_cents || 0); },
    complete(st) { return !!(st.attendance_id && this.paid(st) && st.band_delivered); },
    count(key) {
      if (key === 'todos') return this.students.length;
      const c = this.students.filter((s) => this.complete(s)).length;
      return key === 'completos' ? c : this.students.length - c;
    },
    get visible() {
      const q = this.q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      return this.students.filter((s) => {
        if (this.filter === 'pendientes' && this.complete(s)) return false;
        if (this.filter === 'completos' && !this.complete(s)) return false;
        if (!q) return true;
        return `${s.first_name} ${s.last_name}`.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').includes(q);
      });
    },
    subtitle(st) {
      const a = App.age(st.birth_date);
      return [a !== null ? `${a} años` : null, st.guardian_name ? `Encargado: ${st.guardian_name}` : null].filter(Boolean).join(' · ');
    },

    get needPay() { return !this.paid(this.sel); },
    get needBand() { return !this.sel.band_delivered; },
    get canConfirm() {
      return !this.sel.attendance_id || (this.needPay && this.method) || (this.needBand && this.band);
    },
    get confirmLabel() {
      if (this.needPay && this.method) return `Cobrar ${App.money(Math.round(parseFloat(this.amount || 0) * 100))} y confirmar`;
      return this.sel.attendance_id ? 'Confirmar' : 'Marcar asistencia';
    },

    async openStudent(st) {
      this.sel = st;
      this.error = '';
      this.method = null;
      this.band = true;
      this.photo = '';
      this.amount = ((st.charge_id ? st.class_due_cents : this.current.price_cents) / 100).toFixed(2);
      this.ref = App.newRef();
      if (st.has_photo) {
        const id = st.id;
        App.api('GET', `/api/students/${id}/photo`).then((r) => { if (this.sel?.id === id) this.photo = r.photo; }).catch(() => {});
      }
    },
    close() { this.sel = null; },
    async confirm() {
      this.busy = true;
      this.error = '';
      const body = { session_id: this.current.id, student_id: this.sel.id, wristband: this.needBand && this.band };
      if (this.needPay && this.method) body.payment = { method: this.method, amount: this.amount, client_ref: this.ref };
      try {
        await App.api('POST', '/api/checkin', body);
        const name = this.sel.first_name;
        this.close();
        await Promise.all([this.openSession(this.current.id), this.loadDay()]);
        const st = this.students.find((s) => s.id === body.student_id);
        App.toast(st && this.complete(st) ? `✓ ${name}: check-in completo` : `Guardado: ${name}`);
      } catch (e) {
        this.error = e.message;
      } finally {
        this.busy = false;
      }
    },
    async undo(only) {
      const what = 'la asistencia (si pagó, el dinero queda como saldo a favor)';
      if (!confirm(`¿Anular ${what} de ${this.sel.first_name}? Queda registrado en la auditoría.`)) return;
      try {
        await App.api('DELETE', `/api/checkin/${this.sel.attendance_id}`);
        this.close();
        await Promise.all([this.openSession(this.current.id), this.loadDay()]);
        App.toast('Anulado');
      } catch (e) { this.error = e.message; }
    },
  };
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</body>
</html>
