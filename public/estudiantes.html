<!doctype html>
<html lang="es-PR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudiantes · Runway Center</title>
<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.18/dist/index.global.js"></script>
<link rel="stylesheet" href="/assets/app.css">
<script src="/assets/app.js"></script>
<script src="/assets/nfc.js"></script>
</head>
<body data-page="estudiantes" x-data="students()">
<div id="shell"></div>

<main class="max-w-6xl mx-auto p-4 space-y-4">
  <div class="flex flex-wrap items-center gap-3">
    <h1 class="text-2xl font-semibold text-stone-900">Estudiantes</h1>
    <button type="button" class="btn btn-primary ml-auto" @click="openNew()">+ Nuevo estudiante</button>
  </div>

  <div class="flex flex-wrap gap-2">
    <input type="search" class="input sm:max-w-sm" placeholder="Buscar por nombre, teléfono, email o encargado…" x-model="q"
      @input.debounce.300ms="load()" aria-label="Buscar">
    <select class="input w-auto" x-model="status" @change="load()" aria-label="Estado">
      <option value="activo">Activos</option><option value="inactivo">Inactivos</option><option value="todos">Todos</option>
    </select>
    <select class="input w-auto" x-model="courseFilter" @change="load()" aria-label="Curso">
      <option value="">Todos los cursos</option>
      <template x-for="c in courses" :key="c.id"><option :value="c.id" x-text="c.name"></option></template>
    </select>
  </div>

  <div class="card overflow-hidden">
    <div class="hidden md:grid grid-cols-12 gap-3 px-4 py-2 bg-stone-50 border-b border-stone-200 text-xs font-semibold uppercase tracking-wide text-stone-500">
      <div class="col-span-4">Nombre</div><div class="col-span-3">Contacto</div><div class="col-span-3">Cursos</div><div class="col-span-2">Última visita</div>
    </div>
    <template x-for="s in list" :key="s.id">
      <button type="button" class="w-full text-left grid md:grid-cols-12 gap-x-3 gap-y-0.5 px-4 py-3 border-b border-stone-100 hover:bg-stone-50 min-h-[60px]" @click="open(s.id)">
        <div class="md:col-span-4">
          <div class="font-medium text-stone-900" x-text="`${s.first_name} ${s.last_name}`"></div>
          <div class="text-sm text-stone-500" x-text="[App.age(s.birth_date) !== null ? App.age(s.birth_date) + ' años' : '', s.guardian_name ? 'Enc.: ' + s.guardian_name : ''].filter(Boolean).join(' · ')"></div>
        </div>
        <div class="md:col-span-3 text-sm text-stone-600"><div x-text="s.phone || ''"></div><div class="truncate text-stone-500" x-text="s.email || ''"></div></div>
        <div class="md:col-span-3 text-sm text-stone-600" x-text="s.courses || 'Sin matrícula'"></div>
        <div class="md:col-span-2 text-sm text-stone-500">
          <span x-text="s.last_visit ? App.fmtDate(s.last_visit) : '—'"></span>
          <span class="pill bg-stone-200 text-stone-600 ml-1" x-show="!s.active">Inactivo</span>
          <span class="pill bg-amber-100 text-amber-800 ml-1" x-show="s.active && !s.has_nfc">Sin chapita</span>
          <span class="pill bg-red-100 text-red-800 ml-1" x-show="s.due_cents" x-text="`Debe ${App.money(s.due_cents)}`"></span>
        </div>
      </button>
    </template>
    <p class="p-6 text-center text-stone-500" x-show="loaded && !list.length">No se encontraron estudiantes.</p>
  </div>
  <p class="text-sm text-stone-500" x-text="`${list.length} estudiante(s)`"></p>
</main>

<!-- Detalle / edición -->
<div class="modal-backdrop" x-show="form" x-cloak @keydown.escape.window="form = null" @click.self="form = null">
  <div class="modal sm:max-w-3xl" role="dialog" aria-modal="true" aria-labelledby="sTitle">
    <template x-if="form">
      <div>
        <div class="sticky top-0 bg-white z-10 px-5 pt-5 border-b border-stone-200">
          <div class="flex items-start gap-3">
            <div>
              <h2 id="sTitle" class="text-xl font-semibold" x-text="form.id ? `${form.first_name} ${form.last_name}` : 'Nuevo estudiante'"></h2>
              <p class="text-sm text-stone-500" x-show="detail" x-text="detail && `${detail.totals.classes} clases`"></p>
              <p class="text-sm font-semibold" x-show="detail?.totals.due_cents" x-cloak><span class="text-red-700" x-text="`Debe ${App.money(detail?.totals.due_cents)}`"></span></p>
              <p class="text-sm font-semibold" x-show="detail?.totals.credit_cents" x-cloak><span class="text-emerald-700" x-text="`Saldo a favor ${App.money(detail?.totals.credit_cents)}`"></span></p>
            </div>
            <button type="button" class="ml-auto btn-ghost text-2xl leading-none" @click="form = null" aria-label="Cerrar">&times;</button>
          </div>
          <div class="flex gap-1 mt-3 overflow-x-auto scrollbar-none" x-show="form.id">
            <template x-for="t in [['datos','Datos'],['cuenta','Cuenta'],['cursos','Cursos'],['historial','Asistencia']]" :key="t[0]">
              <button type="button" class="px-4 py-2.5 text-sm font-medium border-b-2" :class="tab === t[0] ? 'border-accent text-accent' : 'border-transparent text-stone-500'"
                @click="tab = t[0]" x-text="t[1]"></button>
            </template>
          </div>
        </div>

        <!-- Datos -->
        <form class="p-5 space-y-4" x-show="tab === 'datos'" @submit.prevent="save()" novalidate>
          <!-- Foto y chapita -->
          <div class="grid gap-3 sm:grid-cols-2" x-show="form.id">
            <div class="card p-3 flex items-center gap-3">
              <div class="w-20 h-20 shrink-0 rounded-xl overflow-hidden bg-stone-100 grid place-items-center text-2xl font-semibold text-stone-500">
                <img x-show="photo" :src="photo" alt="Foto del estudiante" class="w-full h-full object-cover">
                <span x-show="!photo" x-text="(form.first_name[0] || '') + (form.last_name[0] || '')"></span>
              </div>
              <div class="flex flex-col gap-2 flex-1">
                <label class="btn btn-secondary text-sm cursor-pointer">
                  <span x-text="photoBusy ? 'Subiendo…' : (photo ? 'Cambiar foto' : 'Tomar foto')"></span>
                  <input type="file" accept="image/*" capture="environment" class="sr-only" @change="uploadPhoto($event)">
                </label>
                <button type="button" class="btn btn-ghost text-sm text-red-700" x-show="photo" @click="removePhoto()">Quitar foto</button>
              </div>
            </div>
            <div class="card p-3 space-y-2">
              <div class="flex items-center gap-2">
                <span class="font-medium">Chapita NFC</span>
                <span class="pill ml-auto" :class="form.nfc_uid ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'"
                  x-text="form.nfc_uid ? 'Asignada · …' + form.nfc_uid.slice(-4) : 'Sin chapita'"></span>
              </div>
              <template x-if="!assigning">
                <div class="flex flex-wrap gap-2">
                  <button type="button" class="btn btn-primary text-sm flex-1" @click="startAssign()" x-text="form.nfc_uid ? 'Cambiar chapita' : 'Asignar chapita'"></button>
                  <button type="button" class="btn btn-danger text-sm" x-show="form.nfc_uid" @click="removeNfc()">Quitar chapita</button>
                </div>
              </template>
              <template x-if="assigning">
                <div class="space-y-2">
                  <p class="text-sm bg-accent-soft text-accent rounded-lg px-3 py-2 font-medium">Pasa la chapita por el lector ahora…</p>
                  <div class="flex gap-2">
                    <button type="button" class="btn btn-secondary text-sm" x-show="nfcSupported && !nfcOn" @click="startNfc()">Activar NFC</button>
                    <button type="button" class="btn btn-ghost text-sm ml-auto" @click="assigning = false">Cancelar</button>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="grid gap-3 sm:grid-cols-2">
            <div><label class="label" for="fn">Nombre *</label><input id="fn" class="input" x-model="form.first_name" maxlength="60" required>
              <p class="field-error" x-text="errors.first_name"></p></div>
            <div><label class="label" for="ln">Apellidos *</label><input id="ln" class="input" x-model="form.last_name" maxlength="80" required>
              <p class="field-error" x-text="errors.last_name"></p></div>
            <div><label class="label" for="bd">Fecha de nacimiento</label><input id="bd" type="date" class="input" x-model="form.birth_date">
              <p class="field-error" x-text="errors.birth_date"></p></div>
            <div><label class="label" for="gn">Encargado principal</label><input id="gn" class="input" x-model="form.guardian_name" maxlength="100"
              :placeholder="App.age(form.birth_date) !== null && App.age(form.birth_date) < 18 ? 'Requerido para menores' : 'Opcional'"></div>
            <div><label class="label" for="ph">Teléfono</label><input id="ph" class="input" type="tel" inputmode="tel" x-model="form.phone" placeholder="(787) 555-1234">
              <p class="field-error" x-text="errors.phone"></p></div>
            <div><label class="label" for="em">Email</label><input id="em" class="input" type="email" x-model="form.email">
              <p class="field-error" x-text="errors.email"></p></div>
          </div>
          <div><label class="label" for="nt">Notas</label><textarea id="nt" class="input min-h-[80px]" x-model="form.notes" maxlength="1000"
            placeholder="Alergias, permisos, observaciones…"></textarea></div>

          <fieldset class="space-y-2">
            <div class="flex items-center"><legend class="font-semibold">Encargados / contactos</legend>
              <button type="button" class="ml-auto btn-ghost text-sm text-accent" @click="form.guardians.push({ name: '', relationship: '', phone: '', email: '' })"
                x-show="form.guardians.length < 5">+ Añadir</button></div>
            <template x-for="(g, i) in form.guardians" :key="i">
              <div class="grid gap-2 sm:grid-cols-12 items-start bg-stone-50 rounded-xl p-3">
                <input class="input sm:col-span-4" placeholder="Nombre" x-model="g.name" aria-label="Nombre del encargado">
                <select class="input sm:col-span-3" x-model="g.relationship" aria-label="Relación">
                  <option value="">Relación…</option>
                  <template x-for="r in ['Madre','Padre','Abuela','Abuelo','Tía','Tío','Tutor legal','Otro']"><option x-text="r"></option></template>
                </select>
                <input class="input sm:col-span-4" placeholder="Teléfono" type="tel" x-model="g.phone" aria-label="Teléfono del encargado">
                <button type="button" class="btn btn-ghost sm:col-span-1 text-red-700" @click="form.guardians.splice(i, 1)" aria-label="Quitar">&times;</button>
              </div>
            </template>
          </fieldset>

          <div x-show="!form.id" class="space-y-2">
            <p class="font-semibold">Matricular en</p>
            <div class="flex flex-wrap gap-2">
              <template x-for="c in courses" :key="c.id">
                <label class="flex items-center gap-2 card px-3 py-2 cursor-pointer min-h-[48px]">
                  <input type="checkbox" class="w-5 h-5 accent-brand" :value="c.id" x-model.number="form.course_ids">
                  <span class="text-sm" x-text="`${c.name} · ${App.daysLabel(c.days)}`"></span>
                </label>
              </template>
            </div>
          </div>

          <label class="flex items-center gap-2" x-show="form.id">
            <input type="checkbox" class="w-5 h-5 accent-brand" x-model="form.active"> <span>Estudiante activo</span>
          </label>

          <p class="text-sm text-red-700 bg-red-50 rounded-lg px-3 py-2" x-show="error" x-text="error" role="alert"></p>
          <div class="flex flex-wrap gap-2 pt-2">
            <button type="button" class="btn btn-danger" x-show="form.id && isAdmin" @click="remove()">Borrar</button>
            <button type="button" class="btn btn-secondary ml-auto" @click="form = null">Cancelar</button>
            <button class="btn btn-primary" :disabled="busy" x-text="busy ? 'Guardando…' : 'Guardar'"></button>
          </div>
        </form>

        <!-- Cursos -->
        <div class="p-5 space-y-3" x-show="tab === 'cursos'">
          <template x-for="e in detail?.enrollments || []" :key="e.id">
            <div class="flex items-center gap-3 card px-4 py-3">
              <div class="flex-1">
                <div class="font-medium" x-text="e.course_name"></div>
                <div class="text-sm text-stone-500" x-text="`${App.daysLabel(e.days)} · ${App.fmtTime(e.start_time)} · ${App.money(e.price_cents)}/clase · desde ${App.fmtDate(e.enrolled_on)}`"></div>
              </div>
              <button type="button" class="btn text-sm" :class="e.status === 'activo' ? 'btn-secondary' : 'btn-primary'"
                @click="setEnrollment(e, e.status === 'activo' ? 'inactivo' : 'activo')" x-text="e.status === 'activo' ? 'Dar de baja' : 'Reactivar'"></button>
            </div>
          </template>
          <p class="text-stone-500" x-show="!detail?.enrollments.length">Sin matrículas.</p>
          <div class="flex gap-2 pt-2">
            <select class="input" x-model.number="enrollCourse" aria-label="Curso a matricular">
              <option value="">Matricular en otro curso…</option>
              <template x-for="c in courses.filter(c => !detail?.enrollments.some(e => e.course_id === c.id && e.status === 'activo'))" :key="c.id">
                <option :value="c.id" x-text="`${c.name} · ${App.daysLabel(c.days)}`"></option>
              </template>
            </select>
            <button type="button" class="btn btn-primary" :disabled="!enrollCourse" @click="enroll()">Matricular</button>
          </div>
        </div>

        <!-- Cuenta -->
        <div class="p-5 space-y-4" x-show="tab === 'cuenta'">
          <div class="grid grid-cols-2 gap-3">
            <div class="card p-4"><div class="text-sm text-stone-500">Debe</div>
              <div class="text-2xl font-semibold" :class="account.due_cents ? 'text-red-700' : 'text-stone-900'" x-text="App.money(account.due_cents)"></div></div>
            <div class="card p-4"><div class="text-sm text-stone-500">Saldo a favor</div>
              <div class="text-2xl font-semibold" :class="account.credit_cents ? 'text-emerald-700' : 'text-stone-900'" x-text="App.money(account.credit_cents)"></div></div>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="btn btn-secondary" @click="acct = { mode: 'cargo', kind: 'examen', amount: '', description: '', course_id: account.courses[0]?.id || null, method: null }; prefillAcct()">+ Añadir cargo</button>
            <button type="button" class="btn btn-primary" @click="acct = { mode: 'pago', amount: account.due_cents ? (account.due_cents / 100).toFixed(2) : '', method: null, note: '' }; acctRef = App.newRef()">Recibir pago</button>
          </div>

          <!-- Formulario de cargo / pago -->
          <template x-if="acct">
            <div class="card p-4 space-y-3 border-accent">
              <template x-if="acct.mode === 'cargo'">
                <div class="space-y-3">
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    <template x-for="k in [['examen','Examen'],['matricula','Matrícula'],['clase','Clase adicional'],['otro','Otro']]" :key="k[0]">
                      <button type="button" class="btn text-sm" :class="acct.kind === k[0] ? 'btn-primary' : 'btn-secondary'" @click="acct.kind = k[0]; prefillAcct()" x-text="k[1]"></button>
                    </template>
                  </div>
                  <select class="input" x-model.number="acct.course_id" @change="prefillAcct()" x-show="acct.kind !== 'otro' && account.courses.length" aria-label="Curso">
                    <template x-for="c in account.courses" :key="c.id"><option :value="c.id" x-text="c.name" :selected="c.id === acct.course_id"></option></template>
                  </select>
                  <input class="input" x-model="acct.description" maxlength="120" :placeholder="acct.kind === 'otro' ? '¿Qué se cobra? (requerido)' : 'Descripción (opcional)'" aria-label="Descripción">
                </div>
              </template>
              <div class="flex items-center gap-2">
                <label class="text-sm text-stone-600" for="acAmt">Monto $</label>
                <input id="acAmt" class="input max-w-[9rem]" inputmode="decimal" x-model="acct.amount">
                <span class="text-xs text-stone-500" x-show="acct.mode === 'pago'">Si es más de lo que debe, el resto queda a favor (pago adelantado).</span>
              </div>
              <div>
                <span class="label" x-text="acct.mode === 'cargo' ? '¿Paga ahora?' : 'Método de pago'"></span>
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  <template x-for="m in ['efectivo','ath_movil','tarjeta']" :key="m">
                    <button type="button" class="btn text-sm" :class="acct.method === m ? 'btn-primary' : 'btn-secondary'" @click="acct.method = m" x-text="App.METHOD_LABEL[m]"></button>
                  </template>
                  <button type="button" class="btn text-sm" x-show="acct.mode === 'cargo'" :class="acct.method === 'despues' ? 'bg-amber-500 text-white' : 'btn-secondary'"
                    @click="acct.method = 'despues'">Paga después</button>
                </div>
              </div>
              <div class="flex gap-2 justify-end">
                <button type="button" class="btn btn-ghost" @click="acct = null">Cancelar</button>
                <button type="button" class="btn btn-primary" :disabled="acctBusy || !acct.method || !(parseFloat(acct.amount) > 0) || (acct.kind === 'otro' && acct.mode === 'cargo' && !acct.description.trim())"
                  @click="saveAcct()">Guardar</button>
              </div>
            </div>
          </template>

          <div>
            <h3 class="font-semibold mb-2">Cargos</h3>
            <div class="overflow-x-auto border border-stone-200 rounded-xl">
              <table class="table">
                <thead><tr><th>Fecha</th><th>Concepto</th><th class="text-right">Monto</th><th>Estado</th><th x-show="isAdmin"></th></tr></thead>
                <tbody>
                  <template x-for="c in account.charges" :key="c.id">
                    <tr>
                      <td class="whitespace-nowrap" x-text="App.fmtDate(c.local_date)"></td>
                      <td x-text="c.description"></td>
                      <td class="text-right" x-text="App.money(c.amount_cents)"></td>
                      <td><span class="pill" :class="c.due_cents ? 'bg-red-100 text-red-800' : 'bg-emerald-100 text-emerald-800'"
                        x-text="c.due_cents ? (c.due_cents < c.amount_cents ? `Debe ${App.money(c.due_cents)}` : 'Pendiente') : 'Pagado'"></span></td>
                      <td x-show="isAdmin"><button type="button" class="text-xs text-red-700 underline" @click="voidCharge(c)">Anular</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <p class="p-3 text-stone-500" x-show="!account.charges.length">Sin cargos.</p>
            </div>
          </div>
          <div>
            <h3 class="font-semibold mb-2">Pagos</h3>
            <div class="overflow-x-auto border border-stone-200 rounded-xl">
              <table class="table">
                <thead><tr><th>Fecha</th><th class="text-right">Monto</th><th>Método</th><th>Aplicado a</th><th>Cobró</th><th x-show="isAdmin"></th></tr></thead>
                <tbody>
                  <template x-for="p in account.payments" :key="p.id">
                    <tr>
                      <td class="whitespace-nowrap" x-text="App.fmtDateTime(p.created_at)"></td>
                      <td class="text-right" x-text="App.money(p.amount_cents)"></td>
                      <td x-text="App.METHOD_LABEL[p.method]"></td>
                      <td class="text-sm text-stone-600" x-text="(p.applied_to || '') + (p.free_cents ? ` (a favor ${App.money(p.free_cents)})` : '')"></td>
                      <td x-text="p.received_by"></td>
                      <td x-show="isAdmin"><button type="button" class="text-xs text-red-700 underline" @click="voidPayment(p)">Anular</button></td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <p class="p-3 text-stone-500" x-show="!account.payments.length">Sin pagos.</p>
            </div>
          </div>
        </div>

        <!-- Historial -->
        <div class="p-5" x-show="tab === 'historial'">
          <div class="overflow-x-auto">
            <table class="table">
              <thead><tr><th>Fecha</th><th>Clase</th><th>Entrada</th><th>Pago</th><th>Banda</th></tr></thead>
              <tbody>
                <template x-for="h in detail?.history || []" :key="h.attendance_id">
                  <tr>
                    <td class="whitespace-nowrap" x-text="App.fmtDate(h.date)"></td>
                    <td x-text="h.course_name"></td>
                    <td x-text="h.check_in_method === 'nfc' ? 'Chapita' : 'Manual'"></td>
                    <td class="whitespace-nowrap">
                      <span x-show="h.amount_cents && !h.due_cents" x-text="`Pagada ${App.money(h.amount_cents)}`"></span>
                      <span x-show="h.due_cents" class="pill bg-red-100 text-red-800" x-text="`Debe ${App.money(h.due_cents)}`"></span>
                    </td>
                    <td x-text="h.band_delivered ? '✓' : '—'"></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <p class="text-stone-500 py-4" x-show="!detail?.history.length">Sin asistencias registradas.</p>
        </div>
      </div>
    </template>
  </div>
</div>

<script>
function students() {
  const blank = () => ({ id: null, first_name: '', last_name: '', birth_date: '', guardian_name: '', phone: '', email: '', notes: '', active: true, guardians: [], course_ids: [] });
  return {
    list: [], loaded: false, q: '', status: 'activo', courseFilter: '', courses: [], isAdmin: false,
    form: null, detail: null, tab: 'datos', errors: {}, error: '', busy: false, enrollCourse: '', account: { due_cents: 0, credit_cents: 0, charges: [], payments: [], courses: [] }, acct: null, acctRef: '', acctBusy: false, photo: '', photoBusy: false, assigning: false, nfcSupported: NfcInput.webNfcSupported, nfcOn: false,
    async init() {
      App.me().then((r) => (this.isAdmin = r.user.role === 'admin'));
      NfcInput.on((uid) => this.onTag(uid));
      App.api('GET', '/api/courses').then((r) => (this.courses = r.courses));
      await this.load();
      const id = Number(new URLSearchParams(location.search).get('id'));
      if (id) this.open(id);
    },
    async load() {
      const p = new URLSearchParams({ q: this.q, status: this.status });
      if (this.courseFilter) p.set('course_id', this.courseFilter);
      try { this.list = (await App.api('GET', `/api/students?${p}`)).students.sort((a, b) => `${a.first_name} ${a.last_name}`.localeCompare(`${b.first_name} ${b.last_name}`, 'es')); }
      catch (e) { App.toast(e.message, 'error'); }
      this.loaded = true;
    },
    openNew() { this.form = blank(); this.detail = null; this.tab = 'datos'; this.errors = {}; this.error = ''; },
    async open(id) {
      try {
        const d = await App.api('GET', `/api/students/${id}`);
        this.detail = d;
        this.form = { ...blank(), ...d.student, active: !!d.student.active, birth_date: d.student.birth_date || '',
          guardians: d.guardians.map((g) => ({ name: g.name, relationship: g.relationship || '', phone: g.phone || '', email: g.email || '' })) };
        for (const k of ['guardian_name', 'phone', 'email', 'notes']) this.form[k] ||= '';
        this.tab = 'datos'; this.errors = {}; this.error = ''; this.assigning = false;
        this.photo = '';
        this.acct = null;
        this.loadAccount();
        if (d.student.has_photo) App.api('GET', `/api/students/${id}/photo`).then((r) => { if (this.form?.id === id) this.photo = r.photo; }).catch(() => {});
      } catch (e) { App.toast(e.message, 'error'); }
    },
    async save() {
      this.busy = true; this.errors = {}; this.error = '';
      const body = { ...this.form, guardians: this.form.guardians.filter((g) => g.name.trim()) };
      try {
        if (this.form.id) {
          await App.api('PUT', `/api/students/${this.form.id}`, body);
          App.toast('Estudiante actualizado');
          await this.open(this.form.id);
        } else {
          let r;
          try { r = await App.api('POST', '/api/students', body); }
          catch (e) {
            if (e.status === 409 && confirm(`${e.message}. ¿Crear de todos modos?`)) r = await App.api('POST', '/api/students', { ...body, allow_duplicate: true });
            else throw e;
          }
          App.toast('Estudiante creado');
          await this.open(r.id);
        }
        this.load();
      } catch (e) { this.errors = e.details || {}; this.error = e.message; }
      finally { this.busy = false; }
    },
    async remove() {
      if (!confirm(`¿Borrar a ${this.form.first_name} ${this.form.last_name}? Esta acción no se puede deshacer.`)) return;
      try { await App.api('DELETE', `/api/students/${this.form.id}`); App.toast('Estudiante borrado'); this.form = null; this.load(); }
      catch (e) { this.error = e.message; }
    },
    async enroll() {
      try {
        await App.api('POST', '/api/enrollments', { student_id: this.form.id, course_id: this.enrollCourse });
        this.enrollCourse = ''; App.toast('Matriculado'); await this.open(this.form.id); this.tab = 'cursos'; this.load();
      } catch (e) { App.toast(e.message, 'error'); }
    },
    async setEnrollment(e, status) {
      try { await App.api('PUT', `/api/enrollments/${e.id}`, { status }); await this.open(this.form.id); this.tab = 'cursos'; this.load(); }
      catch (err) { App.toast(err.message, 'error'); }
    },
    // ----- Chapita -----
    startAssign() { this.assigning = true; },
    async startNfc() {
      try { await NfcInput.startWebNfc(); this.nfcOn = true; } catch (e) { App.toast(e.message, 'error'); }
    },
    async onTag(uid) {
      if (!this.assigning || !this.form?.id) return;
      this.assigning = false;
      try {
        try { await App.api('POST', `/api/students/${this.form.id}/nfc`, { uid }); }
        catch (e) {
          if (e.status === 409 && confirm(`${e.message}. ¿Pasársela a ${this.form.first_name}? La otra persona se quedará sin chapita.`)) {
            await App.api('POST', `/api/students/${this.form.id}/nfc`, { uid, force: true });
          } else throw e;
        }
        App.toast('Chapita asignada');
        await this.open(this.form.id);
        this.load();
      } catch (e) { App.toast(e.message, 'error'); }
    },
    async removeNfc() {
      if (!confirm(`¿Quitarle la chapita a ${this.form.first_name}? Esa chapita dejará de funcionar.`)) return;
      try { await App.api('DELETE', `/api/students/${this.form.id}/nfc`); App.toast('Chapita quitada'); await this.open(this.form.id); this.load(); }
      catch (e) { App.toast(e.message, 'error'); }
    },
    // ----- Foto: se reduce a 480 px en el navegador antes de subirla -----
    async uploadPhoto(ev) {
      const file = ev.target.files[0];
      ev.target.value = '';
      if (!file) return;
      this.photoBusy = true;
      try {
        const img = await new Promise((ok, fail) => {
          const i = new Image();
          i.onload = () => ok(i);
          i.onerror = () => fail(new Error('No se pudo leer la imagen'));
          i.src = URL.createObjectURL(file);
        });
        const side = Math.min(img.width, img.height);
        const size = Math.min(480, side);
        const c = document.createElement('canvas');
        c.width = c.height = size;
        // Recorte cuadrado centrado
        c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, size, size);
        URL.revokeObjectURL(img.src);
        const data = c.toDataURL('image/jpeg', 0.8);
        await App.api('PUT', `/api/students/${this.form.id}/photo`, { photo: data });
        this.photo = data;
        App.toast('Foto guardada');
      } catch (e) { App.toast(e.message, 'error'); }
      finally { this.photoBusy = false; }
    },
    // ----- Cuenta -----
    async loadAccount() {
      if (!this.form?.id) return;
      try { this.account = await App.api('GET', `/api/students/${this.form.id}/account`); } catch (e) { App.toast(e.message, 'error'); }
    },
    prefillAcct() {
      const c = this.account.courses.find((x) => x.id === this.acct.course_id);
      const v = { examen: c?.exam_fee_cents, matricula: c?.enrollment_fee_cents, clase: c?.price_cents }[this.acct.kind];
      this.acct.amount = v ? (v / 100).toFixed(2) : '';
    },
    async saveAcct() {
      this.acctBusy = true;
      const a = this.acct;
      try {
        if (a.mode === 'cargo') {
          const c = await App.api('POST', '/api/charges', { student_id: this.form.id, kind: a.kind, amount: a.amount,
            course_id: a.kind === 'otro' ? null : a.course_id, description: a.description || null });
          if (a.method !== 'despues') {
            await App.api('POST', '/api/payments', { student_id: this.form.id, amount: a.amount, method: a.method, apply_to: [c.id], client_ref: App.newRef() });
          }
          App.toast(a.method === 'despues' ? 'Cargo anotado como deuda' : 'Cargo cobrado');
        } else {
          await App.api('POST', '/api/payments', { student_id: this.form.id, amount: a.amount, method: a.method, client_ref: this.acctRef });
          App.toast('Pago registrado');
        }
        this.acct = null;
        await this.open(this.form.id);
        this.tab = 'cuenta';
        this.load();
      } catch (e) { App.toast(e.message, 'error'); }
      finally { this.acctBusy = false; }
    },
    async voidCharge(c) {
      if (!confirm(`¿Anular el cargo "${c.description}"? Si estaba pagado, el dinero queda como saldo a favor.`)) return;
      try { await App.api('DELETE', `/api/charges/${c.id}`); await this.open(this.form.id); this.tab = 'cuenta'; this.load(); }
      catch (e) { App.toast(e.message, 'error'); }
    },
    async voidPayment(p) {
      if (!confirm(`¿Anular el pago de ${App.money(p.amount_cents)}? Lo que pagó vuelve a quedar como deuda.`)) return;
      try { await App.api('DELETE', `/api/payments/${p.id}`); await this.open(this.form.id); this.tab = 'cuenta'; this.load(); }
      catch (e) { App.toast(e.message, 'error'); }
    },
    async removePhoto() {
      if (!confirm('¿Quitar la foto?')) return;
      try { await App.api('DELETE', `/api/students/${this.form.id}/photo`); this.photo = ''; App.toast('Foto quitada'); }
      catch (e) { App.toast(e.message, 'error'); }
    },
  };
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
